<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER STRIKE: Survival</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
            z-index: 20;
            pointer-events: none;
        }

        /* Ekranda qon sachrash effekti */
        #blood-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 30%, rgba(180, 0, 0, 0.8) 90%);
            opacity: 0;
            transition: opacity 0.1s ease-in-out;
            z-index: 15;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            z-index: 20;
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #ff0055;
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        #instructions {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #ff0055;
            padding: 25px;
            border-radius: 10px;
            z-index: 30;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
        }
        h1 { color: #ff0055; margin-top: 0; }
    </style>
    <!-- Three.js kutubxonasi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        ❤️ Jon: <span id="health">100</span> | 🤖 Yo'q qilindi: <span id="score">0</span>
    </div>

    <!-- Qon effekti uchun qatlam -->
    <div id="blood-overlay"></div>

    <div id="crosshair"></div>

    <div id="instructions">
        <h1>CYBER STRIKE: SURVIVAL</h1>
        <p>O'yinni boshlash uchun ekranni bosing</p>
        <p style="font-size: 12px; color: #9ca3af;">(Robotlar sizga yetib kelishiga yo'l qo'ymang!)</p>
    </div>

    <script>
        let scene, camera, renderer;
        let score = 0, health = 100;
        let robots = [];
        let isPlaying = false;

        let mouseX = 0, mouseY = 0;
        const instructions = document.getElementById('instructions');
        const bloodOverlay = document.getElementById('blood-overlay');

        instructions.addEventListener('click', () => {
            instructions.style.display = 'none';
            document.body.requestPointerLock();
            isPlaying = true;
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement !== document.body) {
                isPlaying = false;
                instructions.style.display = 'block';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            mouseX -= e.movementX * 0.003;
            mouseY -= e.movementY * 0.003;
            mouseY = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, mouseY));
        });

        // O'q otish
        window.addEventListener('mousedown', () => {
            if (!isPlaying) return;
            shoot();
        });

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050814);
            scene.fog = new THREE.Fog(0x050814, 10, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Yoritish
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00ffff, 1, 30);
            pointLight.position.set(0, 5, 0);
            scene.add(pointLight);

            // Tunnel / Arenani yaratish
            const floorGeo = new THREE.PlaneGeometry(30, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.z = -40;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1f2937 });
            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 100), wallMat);
            leftWall.position.set(-15, 5, -40);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 100), wallMat);
            rightWall.position.set(15, 5, -40);
            scene.add(rightWall);

            // Robotlar tezroq chiqib keladi
            setInterval(spawnRobot, 1800);

            animate();
        }

        function spawnRobot() {
            if (!isPlaying) return;
            
            const group = new THREE.Group();
            
            const botMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x330000, metalness: 0.8 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 0.8), botMat);
            body.position.y = 1;
            group.add(body);

            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const eye = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.2), eyeMat);
            eye.position.set(0, 1.6, 0.41);
            group.add(eye);

            let rx = (Math.random() - 0.5) * 24;
            let rz = -Math.random() * 40 - 20;
            group.position.set(rx, 0, rz);

            scene.add(group);
            robots.push({ mesh: group, zSpeed: 0.1 });
        }

        function triggerBloodEffect() {
            bloodOverlay.style.opacity = '1';
            setTimeout(() => {
                bloodOverlay.style.opacity = '0';
            }, 250);
        }

        function shoot() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                for (let i = robots.length - 1; i >= 0; i--) {
                    let r = robots[i];
                    if (intersects[0].object.parent === r.mesh || intersects[0].object === r.mesh) {
                        scene.remove(r.mesh);
                        robots.splice(i, 1);
                        score += 10;
                        document.getElementById('score').innerText = score;
                        break;
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                camera.rotation.y = mouseX;
                camera.rotation.x = mouseY;

                for (let i = robots.length - 1; i >= 0; i--) {
                    let r = robots[i];
                    r.mesh.position.z += r.zSpeed;

                    // Robot o'yinchiga yetib kelsa (yeb qo'ysa)
                    if (r.mesh.position.z > -0.8 && Math.abs(r.mesh.position.x - camera.position.x) < 1.5) {
                        health -= 20;
                        document.getElementById('health').innerText = health;
                        triggerBloodEffect(); // Qon chiqishi

                        scene.remove(r.mesh);
                        robots.splice(i, 1);

                        if (health <= 0) {
                            alert("HALOK BO'LDINGIZ! Robotlar sizni yeb qo'ydi. Natija: " + score);
                            health = 100;
                            score = 0;
                            document.getElementById('health').innerText = health;
                            document.getElementById('score').innerText = score;
                        }
                    }
                }
            }

            renderer.render(scene, camera);
        }

        init();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
