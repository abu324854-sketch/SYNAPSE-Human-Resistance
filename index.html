<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE 3D: Human vs Robots</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050814;
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            text-align: center;
        }

        #ui-layer {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(17, 24, 39, 0.85);
            border: 2px solid #ff0055;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            width: 700px;
            display: flex;
            justify-content: space-around;
            font-weight: bold;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
        }

        button {
            background: #ff0055;
            color: white;
            border: none;
            padding: 12px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
            font-size: 14px;
        }

        button:hover {
            background: #00ffff;
            color: #050814;
            box-shadow: 0 0 20px #00ffff;
            transform: scale(1.05);
        }
    </style>
    <!-- Three.js Kutubxonasi 3D uchun -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div>⚡ Energiya: <span id="energy">100</span></div>
        <div>❤️ Baza: <span id="base-health">100</span>%</div>
        <div>🤖 Robotlar yo'q qilindi: <span id="score">0</span></div>
    </div>

    <div id="controls">
        <button onclick="spawnHuman()">⚔ 3D Odam Jangchi (Narx: 20⚡)</button>
        <button onclick="spawnMecha()">🦾 3D Katta Ekzoskelet (Narx: 50⚡)</button>
    </div>

    <script>
        // --- 1. SAHNA VA DUNYO (Three.js) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030712);
        scene.fog = new THREE.Fog(0x030712, 20, 70);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 25);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Yoritish
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00ffff, 1, 50);
        pointLight.position.set(0, 10, 0);
        scene.add(pointLight);

        // Jang maydoni (Platforma)
        const arenaGeo = new THREE.BoxGeometry(60, 0.5, 12);
        const arenaMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 });
        const arena = new THREE.Mesh(arenaGeo, arenaMat);
        arena.position.y = -0.5;
        scene.add(arena);

        // Grid chiziqlari
        const grid = new THREE.GridHelper(60, 30, 0x00ffff, 0x1f2937);
        grid.position.y = -0.2;
        scene.add(grid);

        // --- 2. O'YIN O'ZGARUVCHILARI ---
        let energy = 100;
        let baseHealth = 100;
        let score = 0;

        let humans = [];
        let robots = [];

        // Energiya yig'ish
        setInterval(() => {
            if (energy < 150) energy += 5;
            updateUI();
        }, 1000);

        // S.I. Robotlarini chiqarish (O'ng tomondan keladi)
        setInterval(() => {
            spawnRobot();
        }, 3000);

        function updateUI() {
            document.getElementById('energy').innerText = energy;
            document.getElementById('base-health').innerText = baseHealth;
            document.getElementById('score').innerText = score;
        }

        // --- 3. 3D MODELLARNI YARATISH ---
        
        // 3D Odam (Ko'k rangli, bosh va tana qismlaridan iborat)
        function spawnHuman() {
            if (energy < 20) return;
            energy -= 20;
            updateUI();

            const group = new THREE.Group();
            
            // Tana
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, metalness: 0.5 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), bodyMat);
            body.position.y = 0.6;
            group.add(body);

            // Bosh
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
            head.position.y = 1.4;
            group.add(head);

            group.position.set(-25, 0, (Math.random() - 0.5) * 8);
            scene.add(group);

            humans.push({ mesh: group, speed: 0.08, health: 50, power: 0.6 });
        }

        // 3D Katta Ekzoskelet Odam
        function spawnMecha() {
            if (energy < 50) return;
            energy -= 50;
            updateUI();

            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x10b981, metalness: 0.8 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.8, 1), mat);
            body.position.y = 0.9;
            group.add(body);

            group.position.set(-25, 0, (Math.random() - 0.5) * 8);
            scene.add(group);

            humans.push({ mesh: group, speed: 0.04, health: 150, power: 1.8 });
        }

        // 3D Sun'iy Intellekt Robotlari (Qizil rangli tahdid)
        function spawnRobot() {
            const group = new THREE.Group();
            const botMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x550000, metalness: 0.9 });
            
            // Robot tanasi
            const body = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.5, 4), botMat);
            body.rotation.x = Math.PI;
            body.position.y = 0.75;
            group.add(body);

            group.position.set(25, 0, (Math.random() - 0.5) * 8);
            scene.add(group);

            robots.push({ mesh: group, speed: 0.06, health: 40 });
        }

        // --- 4. O'YIN ANIMATSIYA SIKLI ---
        function animate() {
            requestAnimationFrame(animate);

            // Odamlarni harakatlantirish
            for (let i = humans.length - 1; i >= 0; i--) {
                let h = humans[i];
                h.mesh.position.x += h.speed;

                // Robotlar bilan urishish
                for (let j = robots.length - 1; j >= 0; j--) {
                    let r = robots[j];
                    let dist = h.mesh.position.distanceTo(r.mesh.position);
                    if (dist < 1.5) {
                        r.health -= h.power;
                        if (r.health <= 0) {
                            scene.remove(r.mesh);
                            robots.splice(j, 1);
                            score += 10;
                        }
                    }
                }

                // Agar narigi tarafga o'tib ketsa
                if (h.mesh.position.x > 25) {
                    scene.remove(h.mesh);
                    humans.splice(i, 1);
                }
            }

            // Robotlarni harakatlantirish (Insonlar bazasiga qarab)
            for (let j = robots.length - 1; j >= 0; j--) {
                let r = robots[j];
                r.mesh.position.x -= r.speed;

                // Agar inson bazasiga (-25 ga) yetib kelsa
                if (r.mesh.position.x < -24) {
                    baseHealth -= 5;
                    scene.remove(r.mesh);
                    robots.splice(j, 1);
                    if (baseHealth <= 0) {
                        alert("MAG'LUBIYAT! Sun'iy intellekt robotlari bazani egalladi.");
                        baseHealth = 100;
                        score = 0;
                    }
                }
            }

            updateUI();
            renderer.render(scene, camera);
        }

        animate();

        // Oyna o'zgarganda to'g'rilash
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
