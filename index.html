<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER STRIKE: ULTIMATE SURVIVAL</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
            z-index: 20;
            pointer-events: none;
            display: flex;
            gap: 20px;
        }

        #blood-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 20%, rgba(180, 0, 0, 0.85) 90%);
            opacity: 0;
            transition: opacity 0.1s ease-in-out;
            z-index: 15;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            z-index: 20;
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #00ffff;
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        #instructions {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(5, 8, 20, 0.9);
            border: 2px solid #ff0055;
            padding: 30px;
            border-radius: 12px;
            z-index: 30;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
        }
        h1 { color: #ff0055; margin-top: 0; text-shadow: 0 0 10px #ff0055; }
        .key { background: #1f2937; padding: 2px 6px; border-radius: 4px; border: 1px solid #374151; color: #00ffff; }
    </style>
    <!-- Three.js Kutubxonasi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <div>❤️️ Jon: <span id="health">100</span></div>
        <div>🔫 O'q: <span id="ammo">30</span>/30</div>
        <div>🌊 To'lqin: <span id="wave">1</span></div>
        <div>🤖 Yo'q qilindi: <span id="score">0</span></div>
    </div>

    <div id="blood-overlay"></div>
    <div id="crosshair"></div>

    <div id="instructions">
        <h1>CYBER STRIKE: ULTIMATE</h1>
        <p>O'yinni boshlash uchun ekranni bosing</p>
        <p style="font-size: 13px; color: #9ca3af;">
            Sichqoncha bilan nishonga oling, <span class="key">Chap Klish</span> - O't ochish<br>
            <span class="key">R</span> - O'qni almashtirish (Reload)
        </p>
    </div>

    <script>
        // --- OVOZ SINTETIZATORI (Tashqi faylsiz ovozlar) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'shoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'reload') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // --- O'YIN SOZLAMALARI ---
        let scene, camera, renderer;
        let score = 0, health = 100, ammo = 30, wave = 1;
        let robots = [];
        let isPlaying = false;
        let isReloading = false;
        let gun;

        let mouseX = 0, mouseY = 0;
        const instructions = document.getElementById('instructions');
        const bloodOverlay = document.getElementById('blood-overlay');

        instructions.addEventListener('click', () => {
            instructions.style.display = 'none';
            document.body.requestPointerLock();
            isPlaying = true;
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement !== document.body) {
                isPlaying = false;
                instructions.style.display = 'block';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            mouseX -= e.movementX * 0.0025;
            mouseY -= e.movementY * 0.0025;
            mouseY = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, mouseY));
        });

        window.addEventListener('mousedown', () => {
            if (!isPlaying || isReloading) return;
            shoot();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                reloadGun();
            }
        });

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x03050c);
            scene.fog = new THREE.Fog(0x03050c, 8, 45);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Yoritish
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00ffff, 1.2, 25);
            pointLight.position.set(0, 4, 0);
            scene.add(pointLight);

            // Tunnel muhiti
            const floorGeo = new THREE.PlaneGeometry(25, 80);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x0b0f19, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.z = -30;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1, 8, 80), wallMat);
            leftWall.position.set(-12.5, 4, -30);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1, 8, 80), wallMat);
            rightWall.position.set(12.5, 4, -30);
            scene.add(rightWall);

            // --- QUROL MODELINI KAMERAGA QO'SHISH ---
            const gunGroup = new THREE.Group();
            const gunBodyMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: 0.9, roughness: 0.2 });
            const gunBarrel = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 1.2), gunBodyMat);
            gunBarrel.position.set(0.3, -0.3, -0.6);
            gunGroup.add(gunBarrel);
            
            // Lazer nishon ko'rsatkichi
            const laserMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const laser = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.5), laserMat);
            laser.position.set(0.3, -0.25, -1.2);
            gunGroup.add(laser);

            camera.add(gunGroup);
            scene.add(camera);

            // Robotlarni chiqarish boshlanishi
            setInterval(spawnRobot, 1600);

            animate();
        }

        // Robotlarni yaratish
        function spawnRobot() {
            if (!isPlaying) return;
            
            const group = new THREE.Group();
            const botMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x220000, metalness: 0.8 });
            
            // Robot tanasi
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.8, 0.7), botMat);
            body.position.y = 0.9;
            group.add(body);

            // Robotning yaltiroq qizil/sariq ko'zlari
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const eye = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.15, 0.2), eyeMat);
            eye.position.set(0, 1.4, 0.36);
            group.add(eye);

            let rx = (Math.random() - 0.5) * 20;
            let rz = -Math.random() * 35 - 15;
            group.position.set(rx, 0, rz);

            scene.add(group);
            robots.push({ mesh: group, zSpeed: 0.07 + (wave * 0.01) });
        }

        function reloadGun() {
            if (isReloading || ammo === 30) return;
            isReloading = true;
            playSound('reload');
            document.getElementById('ammo').innerText = "O'q uzilmoqda...";
            setTimeout(() => {
                ammo = 30;
                isReloading = false;
                document.getElementById('ammo').innerText = ammo;
            }, 1000);
        }

        function triggerBloodEffect() {
            bloodOverlay.style.opacity = '1';
            setTimeout(() => {
                bloodOverlay.style.opacity = '0';
            }, 200);
        }

        function shoot() {
            if (ammo <= 0) {
                reloadGun();
                return;
            }

            ammo--;
            document.getElementById('ammo').innerText = `${ammo}/30`;
            playSound('shoot');

            // Qurol tebranishi (recoil)
            camera.position.y += 0.05;
            setTimeout(() => camera.position.y = 1.6, 50);

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                for (let i = robots.length - 1; i >= 0; i--) {
                    let r = robots[i];
                    if (intersects[0].object.parent === r.mesh || intersects[0].object === r.mesh) {
                        playSound('hit');
                        scene.remove(r.mesh);
                        robots.splice(i, 1);
                        score += 10;
                        document.getElementById('score').innerText = score;

                        // Har 100 ochkoda to'lqin (wave) oshadi
                        if (score % 100 === 0) {
                            wave++;
                            document.getElementById('wave').innerText = wave;
                        }
                        break;
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                camera.rotation.y = mouseX;
                camera.rotation.x = mouseY;

                // Robotlarni harakati va hujumi
                for (let i = robots.length - 1; i >= 0; i--) {
                    let r = robots[i];
                    r.mesh.position.z += r.zSpeed;

                    // Agar robot o'yinchiga yetib kelsa ("yeb qo'ysa")
                    if (r.mesh.position.z > -0.7 && Math.abs(r.mesh.position.x - camera.position.x) < 1.4) {
                        health -= 25;
                        document.getElementById('health').innerText = health;
                        triggerBloodEffect();
                        playSound('hit');

                        scene.remove(r.mesh);
                        robots.splice(i, 1);

                        if (health <= 0) {
                            alert(`O'YIN TUGADI! Robotlar sizni yeb qo'ydi. 🤖\nUmumiy natijangiz: ${score} ochko (To'lqin: ${wave})`);
                            health = 100;
                            score = 0;
                            wave = 1;
                            ammo = 30;
                            document.getElementById('health').innerText = health;
                            document.getElementById('score').innerText = score;
                            document.getElementById('wave').innerText = wave;
                            document.getElementById('ammo').innerText = ammo;
                        }
                    }
                }
            }

            renderer.render(scene, camera);
        }

        init();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
